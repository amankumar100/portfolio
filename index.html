<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aman Kumar | Portfolio</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />

  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f1f5f9;
      --text: #1e293b;
      --text-secondary: #475569;
      --accent: #38bdf8;
      --input-bg: #e2e8f0;
      --border: #cbd5e1;
      --card-shadow: rgba(0, 0, 0, 0.05);
    }

    body.dark-mode {
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --input-bg: #0f172a;
      --border: #334155;
      --card-shadow: rgba(56, 189, 248, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    header {
      text-align: center;
      padding: 4rem 2rem;
      background-color: var(--bg-secondary);
      border-bottom: 2px solid var(--border);
      position: relative;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      color: var(--accent);
      margin: 0;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1.2rem;
      color: var(--text-secondary);
    }

    #modeToggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    #themeIcon svg {
      width: 28px;
      height: 28px;
      color: var(--accent);
      transition: transform 0.3s;
    }

    #modeToggle:hover svg { transform: scale(1.2); }

    section {
      padding: 3rem 2rem;
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      font-size: 2.2rem;
      color: var(--text);
      text-align: center;
      margin: 0 auto 2rem;
      padding-bottom: 0.5rem;
      width: fit-content;
      opacity: 0;
      position: relative;
    }

    @keyframes slide-in-left {
      from { opacity: 0; left: -80px; }
      to { opacity: 1; left: 0; }
    }

    @keyframes slide-in-right {
      from { opacity: 0; left: 80px; }
      to { opacity: 1; left: 0; }
    }

    section:nth-of-type(1) h2 { animation: slide-in-left 1s ease-out forwards; }
    section:nth-of-type(2) h2 { animation: slide-in-right 1s ease-out forwards; }
    section:nth-of-type(3) h2 { animation: slide-in-left 1s ease-out forwards; }
    section:nth-of-type(4) h2 { animation: slide-in-right 1s ease-out forwards; }

    .card, .contact-form {
      background-color: var(--bg-secondary);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 15px var(--card-shadow);
      margin-bottom: 2rem;
      transition: transform 0.3s ease;
    }

    .card:hover { transform: translateY(-5px); }

    .card h3 { color: var(--accent); margin-top: 0; }

    .contact-form input, .contact-form textarea {
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      width: 100%;
      color: var(--text);
    }

    .contact-form button {
      background-color: var(--accent);
      color: var(--bg);
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: background 0.3s ease;
    }

    .contact-form button:hover { background-color: #0ea5e9; }

    .social-links { text-align: center; margin-top: 1rem; }
    .social-links a {
      color: var(--accent);
      font-size: 30px;
      margin: 0 15px;
      display: inline-block;
      transition: transform 0.3s ease, color 0.3s ease;
    }
    .social-links a:hover {
      transform: scale(1.2);
      color: #60a5fa;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: var(--bg-secondary);
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* Chatbot */
    #chatbot-icon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0ea5e9;
      color: white;
      font-size: 22px;
      padding: 12px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
      z-index: 1000;
    }
    #chatbot-icon:hover { transform: scale(1.1); background: #0284c7; }

    #chatbot {
      position: fixed;
      bottom: 70px;
      right: 20px;
      width: 300px;
      background: #1e293b;
      color: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      overflow: hidden;
      font-family: sans-serif;
      z-index: 1000;
    }
    #chatbot-header {
      background: #0ea5e9;
      padding: 10px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #chatbot-messages {
      padding: 10px;
      overflow-y: auto;
      max-height: 250px;
      font-size: 14px;
    }
    .bot-message, .user-message {
      margin: 5px 0;
      padding: 8px;
      border-radius: 8px;
      max-width: 80%;
    }
    .bot-message { background: #334155; }
    .user-message { background: #0ea5e9; margin-left: auto; }
    #chatbot-input-area { display: flex; }
    #chatbot-input {
      flex: 1;
      padding: 8px;
      border: none;
      outline: none;
    }
    #chatbot-send {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body class="dark-mode">
  <header>
    <button id="modeToggle" title="Toggle Theme"><span id="themeIcon"></span></button>
    <h1>Aman Kumar</h1>
    <p>Software Engineer</p>
  </header>

  <section>
    <h2>About Me</h2>
    <div class="card">
      <p>I’m Aman Kumar, a Computer Science and Information Technology graduate...</p>
    </div>
  </section>

  <section>
    <h2>Projects</h2>
    <div class="card">
      <h3>Human Anomaly Detection</h3>
      <p>Developed an anomaly detection system...</p>
      <a href="https://github.com/amankumar100/Human-Anomaly-Detection" target="_blank" style="color:var(--accent);">View on GitHub</a>
    </div>
  </section>

  <section>
    <h2>Contact Me</h2>
    <form class="contact-form" action="https://formspree.io/f/meokzzpg" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="_replyto" placeholder="Your Email" required>
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </section>

  <section id="connect">
    <h2>Connect with Me</h2>
    <div class="social-links">
      <a href="https://www.linkedin.com/in/amankumar8025" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://github.com/amankumar100" target="_blank"><i class="fab fa-github"></i></a>
      <a href="mailto:kr.aman8025@gmail.com"><i class="fas fa-envelope"></i></a>
    </div>
  </section>

  <footer>&copy; Aman Kumar</footer>

  <!-- Chatbot -->
  <div id="chatbot-icon">💬</div>
  <div id="chatbot">
    <div id="chatbot-header">Chat with Me <span id="chatbot-close">&times;</span></div>
    <div id="chatbot-messages"></div>
    <div id="chatbot-input-area">
      <input type="text" id="chatbot-input" placeholder="Type your message..." />
      <button id="chatbot-send">Send</button>
    </div>
  </div>

  <script>
    // Theme Toggle
    const toggleBtn = document.getElementById("modeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const body = document.body;
    function setIcon() {
      themeIcon.innerHTML = body.classList.contains("dark-mode")
        ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2..."/></svg>`
        : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.64..."/></svg>`;
    }
    toggleBtn.addEventListener("click", () => {
      body.classList.toggle("dark-mode");
      setIcon();
    });
    setIcon();

    // Chatbot Logic
    const chatbot = document.getElementById('chatbot');
    const chatbotIcon = document.getElementById('chatbot-icon');
    const chatbotClose = document.getElementById('chatbot-close');
    const chatbotMessages = document.getElementById('chatbot-messages');
    const chatbotInput = document.getElementById('chatbot-input');
    const chatbotSend = document.getElementById('chatbot-send');

    chatbotIcon.addEventListener('click', () => chatbot.style.display = 'flex');
    chatbotClose.addEventListener('click', () => chatbot.style.display = 'none');

    function addMessage(message, isUser = false) {
      const msg = document.createElement('div');
      msg.className = isUser ? 'user-message' : 'bot-message';
      msg.textContent = message;
      chatbotMessages.appendChild(msg);
      chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
    }

    chatbotSend.addEventListener('click', sendMessage);
    chatbotInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = chatbotInput.value.trim();
      if (!text) return;
      addMessage(text, true);
      chatbotInput.value = '';
      setTimeout(() => {
        addMessage("Thanks for your message! I'll get back to you soon.");
      }, 500);
    }
  </script>
</body>
</html>
